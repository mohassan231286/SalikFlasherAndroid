name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Unzip
        run: |
          unzip "SalikFlasher_Android.zip"
          cp -r SalikWebApp/app .
          cp SalikWebApp/build.gradle .
          cp SalikWebApp/gradle.properties .
          cp SalikWebApp/gradlew .
          cp SalikWebApp/gradlew.bat .
          cp SalikWebApp/settings.gradle .
          cp -r SalikWebApp/gradle .
      - name: Build APK
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SalikFlasher-APK
          path: app/build/outputs/apk/debug/app-debug.apk
